[package]
name = "rust-data-stream-processor"
version = "0.1.0"
edition = "2021"
authors = ["Davyd Eduardo <davyd@davyd.com>"]
description = "A high-performance data stream processor for filtering and transforming large datasets (CSV, JSON)."
repository = "https://github.com/davyd9/rust-data-stream-processor"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
